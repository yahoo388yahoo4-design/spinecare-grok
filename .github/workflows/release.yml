name: Release builds

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Generate test keystore (ephemeral, prototype signing)
        run: |
          keytool -genkeypair -v -keystore spinecare-test.keystore \
            -alias spinecare -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass spinecare-test -keypass spinecare-test \
            -dname "CN=SpineCare Prototype, OU=CI, O=SpineCare, C=US"
      - name: Assemble release APK (signed with test key)
        working-directory: android
        env:
          SPINECARE_KEYSTORE: ${{ github.workspace }}/spinecare-test.keystore
          SPINECARE_KEYSTORE_PASSWORD: spinecare-test
          SPINECARE_KEY_ALIAS: spinecare
          SPINECARE_KEY_PASSWORD: spinecare-test
        run: gradle --no-daemon assembleRelease
      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          name: SpineCare 0.1.0
          prerelease: true
          body: |
            Prototype build. Not a medical device. It does not see discs, nerves, or bone. Use only a plan your clinician approved. Stop and seek urgent care for new weakness, clumsy hands, trouble walking or balancing, or a change in bowel or bladder control.

            ## Files

            - `app-release.apk` — Android app, signed with a throwaway CI key so a phone can install it. Package `com.spinecare.app`. Android 8 or newer.
            - `app-debug.apk` — the same Android app, debug-signed.
            - `SpineCare-unsigned.ipa` — iOS app with **no Apple signature**. An iPhone will refuse it until you sign it with your own Apple Developer account.

            The English/Romanian Expo app is not in this release. Its source is in `expo/`.

            ## Install the Android app

            1. Download `app-release.apk` on the phone, or copy it over USB.
            2. Open the file. If Android blocks it, allow installs from that app (Chrome or Files).
            3. Open SpineCare. The first camera session will ask for the camera permission.

            Tabs: Home, Exercises, Sessions, Sensors, Sleep, Settings.

            1. Read the stop rules on Home.
            2. Open Exercises and start only a movement your clinician already allowed.
            3. Frame the head and shoulders. The phone counts reps from what the camera can see. You can also count a rep yourself.
            4. Sessions keeps the log on the phone, including a recording if you turned recording on.
            5. Sensors can connect to the ESP32 posture node over Bluetooth (service `0xFFF0`).
            6. Settings chooses on-device coaching or an optional server. Leave the server off unless you set one up yourself.

            Camera pictures stay on the phone in on-device mode. `server/gpu` accepts frames. `server/landmarks` accepts pose coordinates only.

            ## Install the iOS app

            This IPA is unsigned, so tap-to-install will fail.

            1. You need a Mac and an Apple Developer account. A free account can sideload through Xcode for about 7 days. A paid account is required for a normal distribution profile.
            2. Unzip `SpineCare-unsigned.ipa` (it contains `Payload/SpineCare.app`).
            3. Re-sign the app with your certificate, for example `codesign -f -s "Apple Development: Your Name" Payload/SpineCare.app`, zip `Payload` back into an `.ipa`, and install with Xcode (Window, Devices and Simulators) or Apple Configurator.
            4. Trust the developer certificate in Settings, General, VPN & Device Management if iOS asks.

            Tabs: Home, Exercises, Sessions, Sensors, Settings. Same rule as Android: clinician-approved movements only. The camera stays on the phone unless you turn the GPU server on.

            ## Expo app

            Separate app, package `com.spinecare.mobile`, English and Romanian. Build it from `expo/` or download the artifact from the Expo Android APK and Expo iOS unsigned build workflows. It is not attached to this release.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk

  ios-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build (unsigned, for CI artifact)
        working-directory: ios
        run: |
          xcodebuild -project SpineCare.xcodeproj -scheme SpineCare \
            -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build build
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/SpineCare.app Payload/
          zip -qr SpineCare-unsigned.ipa Payload
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          name: SpineCare 0.1.0
          prerelease: true
          files: ios/SpineCare-unsigned.ipa
